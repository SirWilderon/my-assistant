<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igor Assistant — Sign In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0a0a0f;
    color: #e8e6e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,142,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(120,60,180,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .container {
    text-align: center;
    padding: 48px 40px;
    max-width: 420px;
    width: 90%;
    position: relative;
  }

  .igor-emoji {
    font-size: 64px;
    display: block;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 20px rgba(79,142,247,0.4));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-size: 32px;
    font-weight: normal;
    letter-spacing: -0.5px;
    color: #f0ede8;
    margin-bottom: 8px;
  }

  .tagline {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #6b7280;
    letter-spacing: 0.5px;
    margin-bottom: 48px;
  }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 36px 32px;
    backdrop-filter: blur(10px);
  }

  .card-title {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 24px;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    background: #fff;
    color: #1f1f1f;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Arial', sans-serif;
  }

  .google-btn:hover {
    background: #f5f5f5;
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .google-btn:active { transform: translateY(0); }

  .google-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .divider span {
    font-size: 12px;
    color: #6b7280;
    font-family: monospace;
  }

  .email-form { display: flex; flex-direction: column; gap: 12px; }

  .email-form input {
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #e8e6e0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .email-form input:focus { border-color: rgba(79,142,247,0.5); }
  .email-form input::placeholder { color: #6b7280; }

  .email-btn {
    padding: 12px;
    background: #4f8ef7;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: Arial, sans-serif;
  }

  .email-btn:hover { background: #3b7de8; }

  .toggle-mode {
    margin-top: 12px;
    font-size: 13px;
    color: #6b7280;
  }

  .toggle-mode a {
    color: #4f8ef7;
    cursor: pointer;
    text-decoration: none;
  }

  .toggle-mode a:hover { text-decoration: underline; }

  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #6b7280;
    min-height: 20px;
    font-family: monospace;
  }

  .status.error { color: #f87171; }
  .status.success { color: #34d399; }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #4b5563;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="container">
  <span class="igor-emoji">🎭</span>
  <h1>Igor Assistant</h1>
  <p class="tagline">Your loyal AI servant awaits, Master</p>

  <div class="card">
    <p class="card-title">Sign in to continue</p>

    <button class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <div class="email-form" id="email-form">
      <input type="email" id="email-input" placeholder="Email address" autocomplete="email">
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
      <button class="email-btn" onclick="signInWithEmail()" id="email-btn">Sign In</button>
      <div class="toggle-mode">
        <span id="toggle-text">Don't have an account?</span>
        <a onclick="toggleMode()" id="toggle-link"> Sign up</a>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">Igor v1.0 · Powered by Gemini & ElevenLabs</div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCgX1yAKcfEN6hGyifTeiwozPaowkh3ARc",
    authDomain: "igor-assistant-612df.firebaseapp.com",
    projectId: "igor-assistant-612df",
    storageBucket: "igor-assistant-612df.firebasestorage.app",
    messagingSenderId: "242750080007",
    appId: "1:242750080007:web:dc682f0170c565616716a2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let isSignUp = false;

  // Check if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // Redirect to setup/app
      window.location.href = 'setup.html';
    }
  });

  window.signInWithGoogle = async function() {
    setStatus('Signing in...', '');
    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged will redirect
    } catch(e) {
      setStatus('Sign in failed: ' + e.message, 'error');
    }
  };

  window.signInWithEmail = async function() {
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('password-input').value;
    if (!email || !password) { setStatus('Please enter email and password', 'error'); return; }

    setStatus('Please wait...', '');
    try {
      if (isSignUp) {
        await createUserWithEmailAndPassword(auth, email, password);
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch(e) {
      setStatus(e.message.replace('Firebase: ', ''), 'error');
    }
  };

  window.toggleMode = function() {
    isSignUp = !isSignUp;
    document.getElementById('email-btn').textContent = isSignUp ? 'Create Account' : 'Sign In';
    document.getElementById('toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
    document.getElementById('toggle-link').textContent = isSignUp ? ' Sign in' : ' Sign up';
    document.getElementById('password-input').autocomplete = isSignUp ? 'new-password' : 'current-password';
  };

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (type || '');
  }
</script>

</body>
</html>
